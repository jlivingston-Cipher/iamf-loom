loom: 0
title: Multilang Feature
sources:
  main: { path: wavs/main.wav, kind: bed, layout: "7.1.4" }
  vo_en: { path: wavs/vo_en.wav, kind: bed, layout: stereo }
  vo_de: { path: wavs/vo_de.wav, kind: bed, layout: stereo }
  vo_fr: { path: wavs/vo_fr.wav, kind: bed, layout: stereo }
elements:
  bed: { from: main }
  vo_en: { from: vo_en }
  vo_de: { from: vo_de }
  vo_fr: { from: vo_fr }
presentations:
  - id: "main-{lang}"
    languages:
      - { lang: en-us, vo: vo_en, label: "English" }
      - { lang: de-de, vo: vo_de, label: "Deutsch" }
      - { lang: fr-fr, vo: vo_fr, label: "Francais" }
    elements:
      - { ref: bed }
      - { ref: "{vo}", gain_db: 0 }
    loudness_layouts: [ stereo, "7.1.4" ]
targets:
  - { format: iamf, out: dist/multilang.iamf }
