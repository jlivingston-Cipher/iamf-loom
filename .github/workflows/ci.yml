# iamf-loom CI — 3-OS × 2-Python matrix (doc 88 Tier B, item 24, doc 97).
#
# Doc 96 recorded Loom as "materially harder than the core, its suite reaches
# for MP4Box/ffmpeg". Measured in doc 97 §3.1, that is not true of the gate
# this matrix runs: every tool-reaching test sits behind `needs_toolchain`
# (keyed on `encoder_main`), and nothing probes ffmpeg independently — running
# the suite with ffmpeg present and with it hidden gives the SAME figure,
# 260 passed / 44 skipped / 0 failed. So no toolchain is installed here, and
# the matrix is the same shape as the core's.
#
# What Loom did carry that the core did not is a real Windows defect, found
# before this file first ran (doc 97 §3.2): `manifest_sha256` hashes the
# manifest file's raw bytes, and the test fixture wrote it in default text
# mode — CRLF on Windows — silently re-hashing every committed plan golden.
# Under a simulated Windows write, 40 of 51 golden/explain assertions failed.
# The fixture now pins `newline="\n"` and a named regression guards it.
#
# Why two checkouts. `tests/test_executor_units.py` builds real IAMF bytes
# with the core's `fixtures/build.py`, which ships in the iamf-sentinel SOURCE
# tree and not in the installed wheel. The sibling checkout supplies it;
# `tests/conftest.py` resolves it by name (`iamf-sentinel/`, `sentinel-oss/`,
# or `$IAMF_SENTINEL_SRC`) and skips that one module cleanly when absent.
#
# Provenance note (doc 97 §4). The Linux leg below was executed verbatim in
# the doc-97 session — 261 passed / 44 skipped / 0 failed in the two-checkout
# layout — and the whole suite was additionally measured green under a Windows
# exec-semantics simulation (260 passed / 44 skipped / 0 failed, no gates
# required). macOS carries no simulated evidence; it is POSIX and the risk was
# judged low.
#
# Claims discipline (item 23): no OS is named in README.md until its leg here
# is green. Removing an OS from this matrix means removing it from that
# sentence in the same commit.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: iamf-loom
      # The core's SOURCE tree — supplies fixtures/ (not shipped in the wheel).
      - uses: actions/checkout@v4
        with:
          repository: jlivingston-Cipher/iamf-sentinel
          path: iamf-sentinel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
        working-directory: iamf-loom
      # Toolchain-gated and archived-fixture tests skip cleanly in this
      # environment; zero failures is the gate.
      # Item 29 (doc 108): CPython's own detector for the doc-98 locale-encoding
      # class — any default-encoding read/write/subprocess-decode fails the leg.
      # doc 128: the sibling checkout above is now LOAD-BEARING, not assumed.
      # Without it tests/test_executor_units.py skips at MODULE level, its 12
      # tests are never collected, and the suite still exits 0 — a green leg
      # one module short. This flag makes that state a hard error.
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests -q
        working-directory: iamf-loom
        env:
          IAMF_SENTINEL_REQUIRE_FULL_COLLECTION: "1"
